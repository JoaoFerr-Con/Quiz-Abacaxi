<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" role="img" aria-label="Sequência em chamas">
  <defs>
    <linearGradient id="fr-outer" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FF3D2E"/>
      <stop offset="55%" stop-color="#FF6A1A"/>
      <stop offset="100%" stop-color="#FF3D2E"/>
    </linearGradient>
    <linearGradient id="fr-inner" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFD23D"/>
      <stop offset="100%" stop-color="#FFA51A"/>
    </linearGradient>
  </defs>

  <!-- corpo externo da chama -->
  <path fill="url(#fr-outer)" d="M50,6
    C36,22 26,36 26,54
    C26,76 36,94 50,100
    C64,94 74,76 74,54
    C74,42 68,32 60,22
    C61,32 56,40 50,44
    C48,32 44,20 50,6 Z"/>

  <!-- chama interna -->
  <path fill="url(#fr-inner)" d="M50,46
    C42,58 37,68 37,80
    C37,92 43,100 50,102
    C57,100 63,92 63,80
    C63,73 59,66 54,60
    C55,67 51,71 48,73
    C46,64 44,56 50,46 Z"/>

  <!-- linhas de movimento (flicker), como na referência -->
  <g fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" opacity="0.92">
    <path d="M22,20 C18,15 18,9 22,4"/>
    <path d="M34,12 C31,8 31,3 34,-1" transform="translate(0,4)"/>
    <path d="M12,34 C7,31 5,26 6,20"/>
  </g>
</svg>
