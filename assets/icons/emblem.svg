<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230" role="img" aria-label="Emblema do Festival do Abacaxi de Barcarena">
  <defs>
    <linearGradient id="em-gold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FFDD7A"/><stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="em-green" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4ECB7A"/><stop offset="100%" stop-color="#1B8E4E"/>
    </linearGradient>
    <linearGradient id="em-orange" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FF8F4D"/><stop offset="100%" stop-color="#E8631F"/>
    </linearGradient>
    <linearGradient id="em-teal" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5FCBD8"/><stop offset="100%" stop-color="#1F8FA3"/>
    </linearGradient>
    <linearGradient id="em-purple" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#8B6BD8"/><stop offset="100%" stop-color="#5A3AAE"/>
    </linearGradient>
    <linearGradient id="em-arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD34D"/><stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <!-- swoosh verde, arco largo sustentando o conjunto -->
  <path d="M14,196 C50,224 170,224 206,196" fill="none" stroke="#22A855" stroke-width="9" stroke-linecap="round"/>

  <!-- arco dourado (comunidade) -->
  <path d="M46,178 C46,150 78,142 110,142 C142,142 174,150 174,178 C174,168 152,172 152,178 C152,168 131,172 131,180 C131,168 110,172 110,182 C110,168 89,172 89,180 C89,168 68,172 68,178 C68,172 46,168 46,178 Z" fill="url(#em-arc)"/>
  <g fill="#8A5A16">
    <circle cx="68" cy="164" r="6"/><path d="M59,178 Q68,161 77,178 Z"/>
    <circle cx="89" cy="158" r="6"/><path d="M80,174 Q89,155 98,174 Z"/>
    <circle cx="110" cy="155" r="6.5"/><path d="M100,173 Q110,151 120,173 Z"/>
    <circle cx="131" cy="158" r="6"/><path d="M122,174 Q131,155 140,174 Z"/>
    <circle cx="152" cy="164" r="6"/><path d="M143,178 Q152,161 161,178 Z"/>
  </g>

  <!-- leque de 5 pétalas largas e sobrepostas -->
  <g transform="rotate(-62 110 172)">
    <path d="M110,172 C88,150 82,110 110,60 C138,110 132,150 110,172 Z" fill="url(#em-gold)"/>
  </g>
  <g transform="rotate(-31 110 172)">
    <path d="M110,172 C88,150 82,110 110,60 C138,110 132,150 110,172 Z" fill="url(#em-green)"/>
  </g>
  <g transform="rotate(0 110 172)">
    <path d="M110,172 C88,150 82,110 110,60 C138,110 132,150 110,172 Z" fill="url(#em-orange)"/>
  </g>
  <g transform="rotate(31 110 172)">
    <path d="M110,172 C88,150 82,110 110,60 C138,110 132,150 110,172 Z" fill="url(#em-teal)"/>
  </g>
  <g transform="rotate(62 110 172)">
    <path d="M110,172 C88,150 82,110 110,60 C138,110 132,150 110,172 Z" fill="url(#em-purple)"/>
  </g>

  <!-- ícones sempre na vertical -->
  <g fill="#fff" opacity="0.96">
    <!-- mineração (barras) -->
    <rect x="26" y="128" width="18" height="6" rx="1.5"/>
    <rect x="26" y="138" width="18" height="6" rx="1.5"/>
    <!-- ambiente (árvores) -->
    <path d="M62,92 L71,108 L53,108 Z"/>
    <rect x="60.5" y="108" width="3" height="9"/>
    <path d="M72,100 L79,112 L65,112 Z" opacity="0.85"/>
    <!-- cultura (nota musical) -->
    <circle cx="105" cy="98" r="5.5"/>
    <rect x="109.5" y="74" width="3.2" height="24"/>
    <path d="M112.7,74 Q124,77 112.7,86 Z"/>
    <!-- indústria (skyline) -->
    <rect x="140" y="98" width="8" height="18"/>
    <rect x="150" y="90" width="8" height="26"/>
    <rect x="160" y="102" width="7" height="14"/>
    <!-- porto (guindaste + navio) -->
    <rect x="176" y="112" width="3" height="26"/>
    <path d="M177.5,114 L194,120" stroke="#fff" stroke-width="3" fill="none"/>
    <rect x="188" y="120" width="7" height="9"/>
    <path d="M170,142 L200,142 L195,150 L175,150 Z" opacity="0.9"/>
  </g>
</svg>
