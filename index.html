<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Quiz do Festival do Abacaxi — Barcarena</title>
  <meta name="description" content="Quiz interativo do Festival do Abacaxi de Barcarena. Responda, acumule XP e descubra sua patente.">

  <!-- Fontes via Google Fonts: só um reforço visual. Sem internet, o CSS já
       cai para a pilha de fontes do sistema (ver --font-display/--font-body
       em css/styles.css) — nada quebra, só fica com a fonte padrão do SO. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">

  <!-- QR Code: vendorizado localmente em assets/qrcode.min.js — o ticket final
       (com XP/acertos da pessoa) precisa funcionar mesmo sem internet no
       local do evento, então essa lib NÃO depende de CDN nenhum. -->
  <script src="assets/qrcode.min.js"></script>

  <!-- Supabase: só é necessário no modo online (ranking ao vivo + retomada
       entre aparelhos). Sem internet, ou sem js/supabase-config.js preenchido,
       o app inteiro degrada sozinho para o modo 100% local (ver js/supabase.js
       e js/state.js) — carregar este script e ele falhar silenciosamente não
       quebra a página. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div id="boot-loader" class="boot-loader">
    <span style="font-size:40px">🍍</span>
    <span>Carregando o quiz…</span>
  </div>

  <main id="app"></main>

  <!-- SPA real: um único index.html, navegação 100% via JS (sem reload). -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
